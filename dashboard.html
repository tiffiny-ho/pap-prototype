<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIS - Triage Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; padding: 20px; margin: 0; }
        .dashboard-container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn-new { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-new:hover { background-color: #0056b3; }
        .table-container { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        th { background-color: #f8f9fa; }
        .btn-open { background-color: #28a745; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-open:hover { background-color: #218838; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .bg-red { background: #ffeaea; color: #dc3545; border: 1px solid #ffc2c2; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h2 style="margin: 0;">📋 Triage Dashboard</h2>
            <!-- 场景 1：初筛员创建新单据入口 -->
            <button class="btn-new" onclick="createNewCase()">➕ New Cytology Request</button>
        </div>
        <div style="font-weight: bold; color: #555;">
            👤 <span id="display_user" style="color:#007bff;">Loading...</span>
            <button onclick="logout()" style="margin-left:10px; cursor:pointer;">Logout</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>Triage</th><th>Cytology No.</th><th>Patient Name</th><th>Received Date</th><th>Action</th></tr>
            </thead>
            <tbody id="worklist_body">
                <!-- Data injected via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 检查登录状态
    var currentUser = localStorage.getItem('lis_current_user');
    if (!currentUser) { window.location.href = 'login.html'; }
    document.getElementById('display_user').innerText = currentUser;

    function logout() { localStorage.removeItem('lis_current_user'); window.location.href = 'login.html'; }

    // 路由场景 1：新建单据 (带 action=new 参数)
    function createNewCase() {
        window.location.href = 'form_engine.html?action=new';
    }

    // 路由场景 2：打开已有单据 (带 action=review 参数)
    function openExistingCase(id, ic, name) {
        var payload = { cyto_no: id, ic_no: ic, name: name };
        localStorage.setItem('lis_pending_case', JSON.stringify(payload));
        window.location.href = 'form_engine.html?action=review&case_id=' + id;
    }

    // 渲染 Mock 数据
    window.onload = function() {
        var cases = [
            { id: "CY-2611-001", name: "SITI AMINAH", ic: "800101145555", date: "2026-11-01", triage: "red" },
            { id: "CY-2611-002", name: "WONG MEI LING", ic: "750304141234", date: "2026-11-03", triage: "orange" }
        ];
        var tbody = document.getElementById('worklist_body');
        for(var i=0; i<cases.length; i++) {
            var c = cases[i];
            var badge = c.triage === 'red' ? '<span class="badge bg-red">🚨 Critical</span>' : '<span class="badge" style="background:#fff3e6; color:#fd7e14; border:1px solid #ffd8b3;">⚠️ Urgent</span>';
            var tr = '<tr>' +
                '<td>' + badge + '</td><td>' + c.id + '</td><td>' + c.name + '<br><small>' + c.ic + '</small></td><td>' + c.date + '</td>' +
                '<td><button class="btn-open" onclick="openExistingCase(\'' + c.id + '\', \'' + c.ic + '\', \'' + c.name + '\')">📂 Review Case</button></td>' +
                '</tr>';
            tbody.innerHTML += tr;
        }
    };
</script>
</body>
</html>
