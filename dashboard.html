<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cytology Worklist Prototype</title><link rel="stylesheet" href="css/app.css"><style>.panel{max-width:1100px;margin:20px auto;background:white;padding:24px;border:1px solid #dbe4e8;border-radius:14px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6ecef;font-size:14px}.btn-link{background:#176b58;color:white;border:0;border-radius:7px;padding:8px 12px;cursor:pointer}</style></head><body><header class="app-topbar"><strong>HOSPITAL SIBU · CYTOLOGY</strong><nav><a href="configuration.html">Configuration</a><span id="user"></span><button onclick="logout()">Log out</button></nav></header><div class="prototype-notice">Prototype worklist — data is stored only in this browser. Use fictional test data.</div><main class="panel"><div class="toolbar"><div><h1 style="margin:0">Cytology Worklist</h1><p>Drafts and simulated workflow tasks</p></div><button class="btn-link" onclick="location.href='cytology-form.html?action=new'">＋ New Cytology Request</button></div><table><thead><tr><th>Cytology No.</th><th>Patient Name</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead><tbody id="cases"></tbody></table></main><script>const user=localStorage.getItem('lis_current_user');if(!user)location.href='login.html';document.getElementById('user').textContent=user||'';function logout(){localStorage.removeItem('lis_current_user');location.href='login.html'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const rows=JSON.parse(localStorage.getItem('cyto_v2_cases')||'[]');document.getElementById('cases').innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${esc(r.id)}</td><td>${esc(r.patient)}</td><td>${esc(r.status)}</td><td>${new Date(r.updatedAt).toLocaleString()}</td><td><button class="btn-link" onclick="openCase(${i})">Open</button></td></tr>`).join(''):'<tr><td colspan="5">No prototype cases saved yet. Select “New Cytology Request” to begin.</td></tr>';function openCase(i){const r=rows[i];localStorage.setItem('lis_pending_case',JSON.stringify({cyto_no:r.id,ic_no:r.ic,name:r.patient,form:r.form||{}}));location.href='cytology-form.html?action=review&case_id='+encodeURIComponent(r.id)}</script></body></html>
