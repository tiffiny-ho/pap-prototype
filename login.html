<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cytology LIS Prototype Login</title><link rel="stylesheet" href="css/app.css"><style>.login{max-width:440px;margin:8vh auto;background:white;padding:32px;border:1px solid #dbe4e8;border-radius:14px}.login label{margin-top:14px}.login button{width:100%;margin-top:20px}</style></head><body><div class="login"><div style="color:#176b58;font-weight:700">HOSPITAL SIBU · CYTOLOGY</div><span class="prototype-tag">PROTOTYPE ONLY</span><h1>Sign in to Prototype</h1><p>This is a simulated role selector, not secure authentication.</p><label>Role</label><select id="role"><option>1ST SCREENER (CYTOTECH)</option><option>2ND SCREENER (SENIOR)</option><option>PATHOLOGIST</option></select><label>Staff display name</label><input id="staff" type="text" placeholder="Enter test display name"><button class="btn" onclick="login()">Continue</button><p style="font-size:12px;color:#7a5014">Do not enter real patient or staff credentials.</p></div><script>function login(){const n=document.getElementById('staff').value.trim();if(!n){alert('Enter a prototype display name.');return;}localStorage.setItem('lis_current_user',n.toUpperCase()+' ['+document.getElementById('role').value+']');location.href='dashboard.html';}</script></body></html>
